<!DOCTYPE html>
<html>
<head>
  <title>Mm↻se↻mm</title>

<!-- SQSP: Page > Settings > Advanced > Page Header Code Injection -->

<style>

  /* SQSP OVERRIDES */
  .takeover *, h1, h2, h3, h4, h5, h6, p, ul, li {
    font-family: 'Times New Roman', Times, serif !important;
    color: white;
    font-size: 1rem;
    text-transform: none;
    line-height: initial;
  }

  #page {
    padding: 5vmin 0 !important;
  }

  #mainContent {
    background: none !important;
    width: 100% !important;
    min-height: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  /* hide navbar */
  #headerWrapper {
    display: none !important;
  }

  /* hide announcement bar */
  .sqs-announcement-bar {
    display: none !important;
  }

  .sqs-block-gallery {
    max-width: 1200px;
    margin: auto;
  }

  /* END SQSP OVERRIDES */

  @font-face {
    font-family: "Chopin Script";
    src: url('https://mm-fonts.unitof.now.sh/chopinscript-mmweb.woff');
  }

  :root {
    --mmbook-inch: 7.2vmin;

    /* 6.25in × 9.25in case, with 1/8in boards. */
    --mmbook-width: calc(var(--mmbook-inch) * 6.15);
    --mmbook-height: calc(var(--mmbook-inch) * 9.15);
    --mmbook-cover-thickness: calc(var(--mmbook-inch) * 0.09);
    --mmbook-spine-thickness: calc(var(--mmbook-inch) * 0.02); /* doesn't look right same thickness as cover boards */

    /* 6in × 9in text block, inset between the cover boards. */
    --mmbook-page-width: calc(var(--mmbook-inch) * 6);
    --mmbook-page-height: calc(var(--mmbook-inch) * 9);
    --mmbook-overhang: calc((var(--mmbook-height) - var(--mmbook-page-height)) / 2);

    /* The 9/16in spine includes both 1/8in cover boards. */
    --mmbook-thickness: calc(var(--mmbook-inch) * 0.7);
    --mmbook-page-thickness: calc(var(--mmbook-thickness) - var(--mmbook-cover-thickness) - var(--mmbook-cover-thickness));
    --mmbook-spine-width: var(--mmbook-thickness);
    /*font-size: min(48px, 4vw);*/ /* doesn't work on Safari */
    font-size: 4vmin;
  }

  body {
    margin: 0 !important;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow-x: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;

    /*max-width: 1200px;*/
    /*margin: auto;*/

    background-color: #c41b1b;
  }

  h1, h2, h3, h4, h5, h6 {
    font-weight: normal;
  }

  #floating-home {
    display: block;
    font-weight: normal;
    font-size: 18px;
    position: fixed;
    margin: 0;
    top: 20px;
    right: 20px;
  }

  @media screen and (max-width: 1100px) {
    #floating-home {
      display: none;
    }
  }

  .takeover {
    text-align: center;
    font-variant: small-caps;
    font-feature-settings: "smcp";
    letter-spacing: 0.1em;
  }

  .takeover .cursive {
    font-family: "Chopin Script", "Snell Roundhand", cursive !important;
    font-size: 1.55em;
    font-variant: none;
    letter-spacing: 0 !important;
    font-weight: normal !important;
  }

  .takeover .cursive {
    padding-left: 0.2em;
    padding-right: 0.2em;
  }

  .takeover .huge.cursive {
    display: block; /* so I can control margins */
    /* Chopin veers too far left centered on its own */
    padding-right: 0;
    line-height: 0.8em;
  }

  .takeover .huge {
    font-size: 4rem;
    letter-spacing: 0.1em;
  }

  .takeover .large {
    font-size: 2rem;
    letter-spacing: 0.1em;
    line-height: 0.7em;
    margin-bottom: 0.2em;
  }

  .takeover .big {
    font-size: 1.2rem;
    letter-spacing: 0.1em;
  }

  .takeover .small {
    font-size: 0.8em;
  }

  .takeover .tiny {
    font-size: 0.5em;
    letter-spacing: 0.1em;
  }

  .takeover .strong {
    font-weight: bold;
  }

  .takeover .italic {
    font-style: italic;
  }

  .takeover .wavy {
    text-decoration: underline;
    text-underline-position: under;
    text-decoration-style: wavy;
  }

  .takeover .normalcaps {
    font-variant: none;
    font-feature-settings: none;
    letter-spacing: 0;
  }

  .takeover .raisebaseline {
    position: relative;
    bottom: 0.07em;
  }

  .takeover .book-section {
    width: 90%;
    margin: auto;
  }

  .takeover .book-section .header {
    border: 1px white;
    border-left-style: solid;
    border-right-style: solid;
    padding: 30px 0;
    margin-bottom: 50px;
  }

  .takeover .book-section .book-hero {
    text-align: left;
    display: flex;
    flex-direction: row;
    justify-content: space-around;
  }

  .takeover .book-section .book-hero .book-spinner {
    flex: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .takeover .book-section .book-hero .book-features {
    flex: 0.7;
    padding-left: 1.5rem;
    align-self: stretch; /* match bottom line to book's caption */
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .takeover .book-features h4,
  .takeover .book-features p.small {
    line-height: 1em;
    margin: 8px 0;
  }

  .takeover .book-features ul {
    list-style: none;
    margin: 0;
  }

  .takeover .book-features li {
    margin: 0.3em 0;
  }

  .takeover .book-features li:last-child {
    margin-bottom: 0;
  }

  .takeover .box-link {
    display: inline-block;
    width: auto;
    margin: 50px auto;
    padding: 1em;
    border: 1px solid white !important;
    font-weight: bold;
    color: white;
    text-decoration: none;
    margin-bottom: 40px;
    line-height: 1.5em;
  }

  .takeover .box-link h4 {
    line-height: 1.5em;
    font-weight: inherit;
    margin: 0;
  }

  .takeover .box-link .cursivefix {
    padding-top: 0.5em;
  }

  .takeover .box-link:hover {
    color: #ed2224;
    background: white;
  }

  .takeover .box-link:hover * {
    /* !important hell */
    color: #ed2224 !important;
  }

  .takeover .buttons {
    max-width: 100vw;
  }

  .takeover .button {
    padding: 1em;
    margin: 40px;
  }

  figure {
    margin: 0;
    padding: 0;
  }

  .takeover .book-spinner .scene {
    width: var(--mmbook-width);
    height: var(--mmbook-height);
    perspective: 24in;
    /*border: 4px solid black;*/
    margin: 40px 1vw;
  }

  .takeover .book-spinner figcaption {
    text-align: center;
  }

  .takeover .book-spinner .case {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transform-origin: 50% 50% calc(-0.5 * var(--mmbook-thickness));
    animation: revolve 10s linear infinite;
    margin-right: 200px;
  }

  .takeover .book-spinner .book {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
  }

  .takeover .book-spinner .prism {
    position: absolute;
    width: var(--prism-width);
    height: var(--prism-height);
    transform-style: preserve-3d;
  }

  .takeover .book-spinner .surface {
    background-color: #f3f3f3;
    position: absolute;
    transform-origin: 0 0;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    background-size: cover;
  }

  .takeover .book-spinner .surface.is-front,
  .takeover .book-spinner .surface.is-back {
    width: var(--prism-width);
    height: var(--prism-height);
  }

  .takeover .book-spinner .surface.is-front {
    transform: translateZ(0);
  }

  .takeover .book-spinner .surface.is-back {
    transform-origin: 50% 50%;
    transform: rotateY(180deg) translateZ(var(--prism-depth));
  }

  .takeover .book-spinner .surface.is-right,
  .takeover .book-spinner .surface.is-left {
    width: var(--prism-depth);
    height: var(--prism-height);
  }

  .takeover .book-spinner .surface.is-right {
    transform: rotateY(90deg) translateZ(var(--prism-width));
  }

  .takeover .book-spinner .surface.is-left {
    transform: rotateY(-90deg) translateX(-100%);
  }

  .takeover .book-spinner .surface.is-top,
  .takeover .book-spinner .surface.is-bottom {
    width: var(--prism-depth);
    height: var(--prism-width);
  }

  .takeover .book-spinner .surface.is-top {
    transform: rotateX(-90deg) rotateZ(90deg) translateY(-100%);
  }

  .takeover .book-spinner .surface.is-bottom {
    transform: rotateX(-90deg) rotateZ(90deg) translateY(-100%) translateZ(var(--prism-height));
  }

  .takeover .book-spinner .text-block {
    --prism-width: var(--mmbook-page-width);
    --prism-height: var(--mmbook-page-height);
    --prism-depth: var(--mmbook-page-thickness);
    transform: translate3d(0, var(--mmbook-overhang), calc(-1 * var(--mmbook-cover-thickness)));
  }

  .takeover .book-spinner .text-block .surface {
    background-color: #fafafa;
  }

  .takeover .book-spinner .text-block .surface.is-right,
  .takeover .book-spinner .text-block .surface.is-top,
  .takeover .book-spinner .text-block .surface.is-bottom {
    background-image: url(/img/foreedge.jpg);
    background-position: center;
    background-repeat: no-repeat;
  }

  .takeover .book-spinner .text-block .surface.is-top {
    background-position-x: 100%;
  }

  .takeover .book-spinner .cover-board {
    --prism-width: var(--mmbook-width);
    --prism-height: var(--mmbook-height);
    --prism-depth: var(--mmbook-cover-thickness);
  }

  .takeover .book-spinner .cover-board .surface,
  .takeover .book-spinner .spine-board .surface {
    background-color: #e8e8e8;
  }

  .takeover .book-spinner .front-board {
    transform: translate3d(0, 0, 0);
  }

  .takeover .book-spinner .front-board .surface.is-front {
    background-image: url(/img/front.svg);
  }

  .takeover .book-spinner .front-board .surface.is-front::after,
  .takeover .book-spinner .back-board .surface.is-back::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    width: calc(var(--mmbook-width) * 0.025);
    pointer-events: none;
    background: linear-gradient(
      90deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.32) 24%,
      rgba(80, 76, 76, 0.18) 48%,
      rgba(255, 255, 255, 0.24) 72%,
      rgba(255, 255, 255, 0) 100%
    );
  }

  .takeover .book-spinner .front-board .surface.is-front::after {
    left: calc(var(--mmbook-width) * 0.018);
    animation: front-groove-light 10s linear infinite;
  }

  .takeover .book-spinner .back-board {
    transform: translate3d(0, 0, calc(var(--mmbook-cover-thickness) - var(--mmbook-thickness)));
  }

  .takeover .book-spinner .back-board .surface.is-back {
    background-image: url(/img/back.svg);
  }

  .takeover .book-spinner .back-board .surface.is-back::after {
    right: calc(var(--mmbook-width) * 0.018);
    transform: scaleX(-1);
    animation: back-groove-light 10s linear infinite;
  }

  .takeover .book-spinner .spine-board {
    --prism-width: var(--mmbook-spine-thickness);
    --prism-height: var(--mmbook-height);
    --prism-depth: var(--mmbook-spine-width);
    transform: translate3d(calc(-1 * var(--mmbook-spine-thickness)), 0, 0);
  }

  .takeover .book-spinner .spine-board .surface {
    background: black;
  }

  .takeover .book-spinner .spine-board .surface.is-left {
    background-image: url(/img/spine.svg);
  }

  @keyframes front-groove-light {
    0%, 100% {
      opacity: 0.9;
    }
    25%, 75% {
      opacity: 0.35;
    }
    50% {
      opacity: 0.6;
    }
  }

  @keyframes back-groove-light {
    0%, 100% {
      opacity: 0.6;
    }
    25%, 75% {
      opacity: 0.35;
    }
    50% {
      opacity: 0.9;
    }
  }

  @keyframes revolve {
    from {
      transform: rotateY(0);
    }
    to {
      transform: rotateY(-360deg);
    }
  }

</style>

<!-- END Page Header Code Injection -->

</head>

<!-- SQSP: Code Block at top of page -->

<div class="takeover">
  <div class="book-section">
    <div class="book-hero">
      <div class="book-spinner">
        <div class="scene">
          <div class="case">
            <a class="book" href="/text.html">
              <div class="prism text-block">
                <figure class="surface is-front"></figure>
                <figure class="surface is-right"></figure>
                <figure class="surface is-back"></figure>
                <figure class="surface is-left"></figure>
                <figure class="surface is-top"></figure>
                <figure class="surface is-bottom"></figure>
              </div>
              <div class="prism cover-board front-board">
                <figure class="surface is-front"></figure>
                <figure class="surface is-right"></figure>
                <figure class="surface is-back"></figure>
                <figure class="surface is-left"></figure>
                <figure class="surface is-top"></figure>
                <figure class="surface is-bottom"></figure>
              </div>
              <div class="prism cover-board back-board">
                <figure class="surface is-front"></figure>
                <figure class="surface is-right"></figure>
                <figure class="surface is-back"></figure>
                <figure class="surface is-left"></figure>
                <figure class="surface is-top"></figure>
                <figure class="surface is-bottom"></figure>
              </div>
              <div class="prism spine-board">
                <figure class="surface is-front"></figure>
                <figure class="surface is-right"></figure>
                <figure class="surface is-back"></figure>
                <figure class="surface is-left"></figure>
                <figure class="surface is-top"></figure>
                <figure class="surface is-bottom"></figure>
              </div>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

</html>
